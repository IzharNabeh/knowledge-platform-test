<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>KnowledgePlatformTest</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <app-root></app-root>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var mode = params.get('widgetMode') === 'npm' ? 'npm' : 'script';

      if (mode !== 'script') {
        return;
      }

      var script = document.createElement('script');
      script.src = '/assets/chat-widget/browser.iife.js';
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
